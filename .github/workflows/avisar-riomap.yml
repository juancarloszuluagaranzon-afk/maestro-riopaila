# Cuando cambia maestro.csv en main, avisa a Rio Map (agrocontrol-campo) para
# que su workflow "Sync maestro" regenere el maestro y abra el PR de inmediato.
# Requiere el secreto RIOMAP_DISPATCH_TOKEN (PAT fine-grained con permiso
# Contents + Pull requests sobre agrocontrol-campo). Sin el secreto no falla:
# Rio Map se sincroniza igual en su corrida diaria (06:00, L-V).
# No afecta a GitHub Pages: el sitio se sigue publicando desde main.
name: Avisar a Rio Map

on:
  push:
    branches: [main]
    paths: [maestro.csv]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  avisar:
    runs-on: ubuntu-latest
    env:
      TOKEN: ${{ secrets.RIOMAP_DISPATCH_TOKEN }}
    steps:
      - name: Sin token configurado
        if: env.TOKEN == ''
        run: echo "RIOMAP_DISPATCH_TOKEN no está configurado; Rio Map tomará el cambio en su sincronización diaria."

      # TEMPORAL: dice qué alcance tiene el token, para saber qué permiso le
      # falta sin tener que adivinar. El token viaja en una cabecera y no se
      # imprime nunca; solo salen códigos de estado y el objeto `permissions`.
      - name: DIAGNOSTICO TEMPORAL - alcance del token
        if: env.TOKEN != ''
        run: |
          API=https://api.github.com/repos/juancarloszuluagaranzon-afk/agrocontrol-campo
          echo "--- GET del repositorio (dice si el token lo ve y con qué acceso)"
          curl -s -o cuerpo.json -w '    HTTP %{http_code}' -H "Authorization: Bearer $TOKEN" -H "Accept: application/vnd.github+json" "$API"
          echo ""
          echo "    permissions: $(jq -c '.permissions // "(no viene)"' cuerpo.json)"
          echo "    mensaje....: $(jq -r '.message // "(ok)"' cuerpo.json)"
          echo "--- POST del dispatch (el que está fallando)"
          curl -s -o envio.json -w '    HTTP %{http_code}' -X POST -H "Authorization: Bearer $TOKEN" -H "Accept: application/vnd.github+json" "$API/dispatches" -d '{"event_type":"diagnostico-token"}'
          echo ""
          echo "    mensaje....: $(jq -r '.message // "(sin cuerpo = exito)"' envio.json)"

      - name: Enviar repository_dispatch a agrocontrol-campo
        if: env.TOKEN != ''
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ env.TOKEN }}
          repository: juancarloszuluagaranzon-afk/agrocontrol-campo
          event-type: maestro-actualizado
          client-payload: '{"sha": "${{ github.sha }}", "ref": "${{ github.ref }}"}'

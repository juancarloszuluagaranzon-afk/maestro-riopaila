# Cuando cambia maestro.csv en main, avisa a Rio Map (agrocontrol-campo) para
# que su workflow "Sync maestro" regenere el maestro y abra el PR de inmediato.
# Requiere el secreto RIOMAP_DISPATCH_TOKEN (PAT fine-grained sobre
# agrocontrol-campo con Contents y Pull requests en READ AND WRITE: con
# Read-only el GET del repo pasa pero el POST de dispatches devuelve 403
# "Resource not accessible by personal access token"). Caduca el 7-abr-2027.
# Sin el secreto no falla: Rio Map se sincroniza igual en su corrida diaria
# (06:00, L-V). No afecta a GitHub Pages: el sitio se publica desde main.
name: Avisar a Rio Map

on:
  push:
    branches: [main]
    paths: [maestro.csv]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  avisar:
    runs-on: ubuntu-latest
    env:
      TOKEN: ${{ secrets.RIOMAP_DISPATCH_TOKEN }}
    steps:
      - name: Sin token configurado
        if: env.TOKEN == ''
        run: echo "RIOMAP_DISPATCH_TOKEN no está configurado; Rio Map tomará el cambio en su sincronización diaria."

      - name: Enviar repository_dispatch a agrocontrol-campo
        if: env.TOKEN != ''
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ env.TOKEN }}
          repository: juancarloszuluagaranzon-afk/agrocontrol-campo
          event-type: maestro-actualizado
          client-payload: '{"sha": "${{ github.sha }}", "ref": "${{ github.ref }}"}'
